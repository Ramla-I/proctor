[package]
name = "void_ptr_finder"
version = "0.1.0"
edition = "2021"

# Symbolic (syn) detector for the void-pointer class of recoveries in a
# C2Rust+CRAT crate: void*+tag dispatch functions and void*-payload tagged-union
# structs (-> Rust enum), and void*-erased container fields (-> generics / a
# typed collection). A lightweight stand-in for crat's rustc-level void_finder;
# deps match the other tools so it builds offline from the shared cargo cache.
[dependencies]
clap = { version = "4.5.37", features = ["derive"] }
proc-macro2 = { version = "1.0.95", features = ["span-locations"] }
quote = "1.0.40"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
syn = { version = "2.0.101", features = ["full", "visit"] }

[profile.release]
strip = true
