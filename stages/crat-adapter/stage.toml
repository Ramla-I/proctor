id = "crat"
version = "0.2.0"
description = "CRAT symbolic transformation passes over c2rust output."

exec = ["python3", "main.py"]
warmup = ["python3", "main.py", "--build-only"]

[requires]
rust_project = "required"

[produces]
rust_project = true

[config]
final_pass = { type = "string", default = "bin", doc = "last pass of the chain to run" }
passes = { type = "array", doc = "exact ordered pass sequence; mutually exclusive with final_pass" }
pass_args = { type = "table", doc = "per-pass argument lists replacing built-in defaults" }
check_build = { type = "bool", default = true, doc = "cargo build the final transformed project before reporting success" }
crat_dir = { type = "string", default = "../crat", doc = "crat checkout, relative to this adapter" }
