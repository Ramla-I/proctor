# CRAT smoke test pipeline: one real symbolic stage over the vendored
# c2rust output of Public-Tests/B01_synthetic/001_helloworld.
#
#   uv run proctor run -c tests/e2e/crat_smoke.toml \
#     --input-rust tests/e2e/fixtures/001_helloworld/c2rust

[run]
provides = ["rust_project", "test_package"]

[testing]
after_each_stage = true   # gate the crat stage on the test package (M6)

[pipeline]
order = ["crat"]

[stages.crat]
uses = "stages/crat-adapter"
timeout_s = 3600
