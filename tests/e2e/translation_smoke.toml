# Full translation-component pipeline: C source → c2rust → CRAT →
# tested Rust with proctor.toml.
#
#   uv run proctor run -c tests/e2e/translation_smoke.toml \
#     --input-c tests/e2e/fixtures/001_helloworld/c \
#     --tests   tests/e2e/fixtures/001_helloworld/tests

[run]
provides = ["c_project", "test_package"]

# Vector gating is ON — but per-stage: the c2rust stage's output is a
# library crate even for executable cases (the bin arrives with crat's
# bin pass), so its gate is off; crat's output is gated on the vectors.
[testing]
after_each_stage = true

[pipeline]
order = ["c2rust", "crat"]

[stages.c2rust]
uses = "stages/c2rust-adapter"
timeout_s = 1800
gate_tests = false   # lib-shaped mid-component output; see note above

[stages.crat]
uses = "stages/crat-adapter"
timeout_s = 3600
